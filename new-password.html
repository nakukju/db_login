<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // Supabase 설정
    const SUPABASE_URL = "https://dsmeemqhcbdnzaomazoo.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cGW_2CG6VVw7pj4S9pesOA_RPMV0xHe";
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 변경</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a href="index.html" class="logo">
      <img src="logo.svg" alt="">
      <span>내 포트폴리오</span>
    </a>
  </header>

  <main>
    <div class="auth-card">
      <h1>비밀번호 변경</h1>

      <form id="password-form">
        <div class="field">
          <label for="new-password">새 비밀번호</label>
          <input type="password" id="new-password" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" id="change-btn" class="btn-primary" disabled>비밀번호 변경</button>
      </form>

      <p id="result" class="result" role="alert" hidden></p>
    </div>
  </main>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("password-form");
    const button = document.getElementById("change-btn");
    const passwordInput = document.getElementById("new-password");
    const result = document.getElementById("result");

    // 안내 문구 표시 (type: "error" = 빨간 상자, "success" = 초록 상자, "info" = 회색 글씨)
    function showMessage(text, type = "error") {
      result.textContent = text;
      result.className = "result result-" + type;
      result.hidden = !text;
    }

    function toKoreanError(error) {
      if (error.code === "same_password") {
        return "이전과 다른 비밀번호를 입력해주세요";
      }
      return "실패했어요: " + error.message;
    }

    // 재설정 메일의 링크로 들어오면 주소에 담긴 정보로 Supabase가 임시 로그인을 해줌.
    // 그 로그인이 있어야 비밀번호를 바꿀 수 있음.
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        button.disabled = false;
        passwordInput.focus();
      } else {
        showMessage("링크가 만료되었거나 올바르지 않아요. 비밀번호 재설정 메일을 다시 요청해주세요.");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("변경 중...", "info");
      button.disabled = true;

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: passwordInput.value
        });

        if (error) {
          showMessage(toKoreanError(error));
          button.disabled = false;
          return;
        }

        showMessage("비밀번호가 바뀌었습니다", "success");

        // 로그인 화면은 로그인된 사람을 홈으로 보내므로, 먼저 로그아웃하고 이동
        await supabaseClient.auth.signOut();
        setTimeout(() => location.replace("login.html"), 1500);
      } catch (error) {
        showMessage(toKoreanError(error));
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
